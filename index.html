<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description" content="Assignment Lookup app to find student assignment topics by NPM.">
    <title>Assignment Lookup</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">
    <div class="container">
        <header class="app-header">
            <h1>Assignment Lookup</h1>
            <p class="subtitle">Enter your Student ID (NPM)</p>
        </header>

        <form id="searchForm" class="lookup-form">
            <input
                type="text"
                id="idInput"
                placeholder="Enter your NPM"
                inputmode="numeric"
                autocomplete="off"
                aria-label="Student ID">

            <button type="submit">Find Assignment</button>
        </form>

        <div id="result" class="result-container" aria-live="polite"></div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
